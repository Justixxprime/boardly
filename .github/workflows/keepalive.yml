# Keeps the free Supabase project awake.
# Free projects pause after 7 days with no activity. This pings the database
# every 3 days with one tiny real query. If the project is paused or the API
# is rejecting requests, the step fails and GitHub emails you about it.
name: keep-supabase-awake

on:
  schedule:
    - cron: "0 7 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -fsS "$SUPABASE_URL/rest/v1/marketplace_services?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" > /dev/null
