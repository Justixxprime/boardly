<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>if(localStorage.getItem('boardly-theme')==='dark'){document.documentElement.classList.add('dark')}</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Invoice | Boardly</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 28 28%22><rect width=%2228%22 height=%2228%22 rx=%227%22 fill=%22%2312203A%22/><rect x=%226%22 y=%227%22 width=%225%22 height=%2214%22 rx=%221.5%22 fill=%22%23E8622C%22/><rect x=%2212.5%22 y=%227%22 width=%225%22 height=%229%22 rx=%221.5%22 fill=%22%230F9A78%22/><rect x=%2219%22 y=%227%22 width=%223%22 height=%226%22 rx=%221.5%22 fill=%22%236355C7%22/></svg>">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12203A">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=synonym@400,500,600,700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: { extend: {
      colors: { paper:'var(--paper)', 'paper-2':'var(--paper-2)', ink:'var(--ink)', 'ink-soft':'var(--ink-soft)', orange:'var(--orange)', 'orange-dark':'var(--orange-dark)', teal:'var(--teal)', violet:'var(--violet)', pink:'var(--pink)', line:'var(--line)', card:'var(--card)', critical:'var(--critical)' },
      fontFamily: { display:['"Fraunces"','Georgia','serif'], body:['"Synonym"','-apple-system','sans-serif'], mono:['"IBM Plex Mono"','monospace'] }
    }}
  }
</script>
</head>
<body class="font-body text-ink antialiased min-h-screen flex flex-col" style="background:var(--paper-2)">

<header class="px-6 h-16 flex items-center justify-center max-w-lg mx-auto w-full border-b border-line">
  <div class="flex items-center gap-2 font-display font-bold text-lg">
    <svg width="28" height="28" viewBox="0 0 28 28" fill="none"><rect width="28" height="28" rx="7" fill="var(--ink)"/><rect x="6" y="7" width="5" height="14" rx="1.5" fill="var(--orange)"/><rect x="12.5" y="7" width="5" height="9" rx="1.5" fill="var(--teal)"/><rect x="19" y="7" width="3" height="6" rx="1.5" fill="var(--violet)"/></svg>
    Boardly
  </div>
</header>

<main class="flex-1 max-w-lg mx-auto px-5 py-12 w-full">

  <div id="invoice-loading" class="text-center py-16 text-ink-soft text-sm">
    <i class="fa-solid fa-circle-notch fa-spin mr-1.5"></i>Loading…
  </div>

  <div id="invoice-notfound" class="hidden text-center py-16">
    <p class="text-sm text-ink-soft">This invoice link isn't valid.</p>
  </div>

  <div id="invoice-wrap" class="hidden">
    <div class="flex items-start justify-between mb-1">
      <div>
        <p id="invoice-from" class="text-xs text-ink-soft mb-1"></p>
        <h1 id="invoice-title" class="font-display font-bold text-2xl">Invoice</h1>
      </div>
      <span id="invoice-status-badge" class="badge"></span>
    </div>
    <p id="invoice-client" class="hidden text-sm text-ink-soft mt-1 mb-4"></p>
    <div id="invoice-dates" class="hidden flex gap-6 text-xs text-ink-soft mb-4">
      <span id="invoice-issue-date"></span>
      <span id="invoice-due-date"></span>
    </div>
    <p id="invoice-notes" class="hidden text-sm mb-6"></p>

    <div class="ticket p-4 mb-6">
      <table class="w-full text-sm">
        <thead>
          <tr class="text-left text-xs text-ink-soft border-b border-line">
            <th class="pb-2 font-medium">Item</th>
            <th class="pb-2 font-medium text-right">Qty</th>
            <th class="pb-2 font-medium text-right">Price</th>
            <th class="pb-2 font-medium text-right">Total</th>
          </tr>
        </thead>
        <tbody id="invoice-items"></tbody>
      </table>
      <div class="flex items-center justify-between border-t border-line mt-3 pt-3">
        <span class="font-display font-semibold">Total</span>
        <span id="invoice-grand-total" class="font-display font-bold text-lg"></span>
      </div>
      <div id="invoice-paid-row" class="hidden flex items-center justify-between text-sm mt-1">
        <span class="text-ink-soft">Paid</span>
        <span id="invoice-amount-paid" class="text-secondary font-medium"></span>
      </div>
      <div id="invoice-balance-row" class="hidden flex items-center justify-between text-sm mt-1 font-semibold">
        <span>Balance due</span>
        <span id="invoice-balance-due"></span>
      </div>
    </div>

    <p class="text-center text-xs text-ink-soft">This invoice is for your records. To arrange payment, please contact whoever sent it to you directly.</p>
  </div>

</main>

<footer class="text-center text-xs text-ink-soft py-6">Built with Boardly</footer>

<div id="toast-wrap" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 items-end"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/site.js"></script>
<script src="js/invoice-page.js"></script>
</body>
</html>
