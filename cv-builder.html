<script>
  tailwind.config = {
    darkMode: 'class',
    theme: { extend: {
      colors: { paper:'var(--paper)', 'paper-2':'var(--paper-2)', ink:'var(--ink)', 'ink-soft':'var(--ink-soft)', orange:'var(--orange)', 'orange-dark':'var(--orange-dark)', teal:'var(--teal)', violet:'var(--violet)', pink:'var(--pink)', line:'var(--line)', card:'var(--card)', critical:'var(--critical)' },
      fontFamily: { display:['"Fraunces"','Georgia','serif'], body:['"General Sans"','-apple-system','sans-serif'], mono:['"IBM Plex Mono"','monospace'] }
    }}
  }
</script>
<style>
  /* Accordion: grid-template-rows 0fr -> 1fr rather than max-height,
     so it always animates to the content's real height instead of a
     guessed pixel ceiling that either overshoots or clips. */
  .cvb-acc-body{ display:grid; grid-template-rows:0fr; transition:grid-template-rows .28s cubic-bezier(.4,0,.2,1); }
  .cvb-acc-body > div{ overflow:hidden; }
  .cvb-acc[data-open="true"] .cvb-acc-body{ grid-template-rows:1fr; }
  .cvb-acc-chevron{ transition:transform .25s ease; }
  .cvb-acc[data-open="true"] .cvb-acc-chevron{ transform:rotate(180deg); }

  /* Cross-fade when the preview re-renders after a real change -
     picking a template, a color, or typing - not a page-load flourish. */
  .cvb-preview-fade{ animation:cvbFadeIn .3s ease; }
  @keyframes cvbFadeIn{ from{ opacity:.4; } to{ opacity:1; } }

  .cvb-template-swatch{ transition:transform .18s ease; }
  .cvb-template-swatch:hover{ transform:translateY(-2px); }
  .cvb-template-swatch[data-active="true"]{ outline:2px solid var(--orange); outline-offset:1px; }
  .cvb-color-dot[data-active="true"]{ box-shadow:0 0 0 2px var(--paper), 0 0 0 4px currentColor; }

  .cvb-entry-card{ border:1px solid var(--line); border-radius:10px; padding:10px; }

  /* The resume itself: a fixed light palette independent of app dark
     mode - a CV sent to an employer should always look like an
     ordinary document, never dark, whatever theme its author prefers
     while editing it. */
  .resume-page{
    --rp-ink:#1c1c1c; --rp-soft:#666666; --rp-line:#dddddd; --rp-paper:#ffffff;
    background:var(--rp-paper); color:var(--rp-ink);
    width:100%; max-width:210mm; margin:0 auto; font-size:13px; line-height:1.5;
    box-shadow:0 1px 3px rgba(0,0,0,.08), 0 14px 34px -14px rgba(0,0,0,.22);
  }
  .resume-page, .resume-page *{ box-sizing:border-box; }
  .rp-body{ padding:18mm 16mm; }
  .rp-section + .rp-section{ margin-top:18px; }
  .rp-label{ font-weight:600; font-size:12.5px; margin:0 0 10px; }
  .rp-contact{ display:flex; flex-wrap:wrap; gap:4px 16px; font-size:12px; color:var(--rp-soft); }
  .rp-contact span{ display:inline-flex; align-items:center; gap:6px; }
  .rp-entry + .rp-entry{ margin-top:13px; }
  .rp-entry-head{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
  .rp-role{ font-weight:600; font-size:13.5px; }
  .rp-org{ font-size:12.5px; color:var(--rp-soft); }
  .rp-dates{ font-size:11px; color:var(--rp-soft); white-space:nowrap; }
  .rp-bullets{ margin:6px 0 0; padding-left:17px; }
  .rp-bullets li{ margin:2px 0; }
  .rp-tag{ display:inline-block; font-size:11.5px; padding:3px 10px; border-radius:999px; margin:0 6px 6px 0; }
  .rp-empty-hint{ color:var(--rp-soft); font-style:italic; }

  /* Ledger - editorial serif headline, hairline rules, dates set in a
     monospace column as real scannable data, not decoration. */
  .rt-ledger .rp-name{ font-family:'Fraunces',serif; font-weight:700; font-size:28px; line-height:1.1; }
  .rt-ledger .rp-title{ font-size:14px; margin-top:4px; }
  .rt-ledger .rp-header{ padding-bottom:14px; border-bottom:2px solid var(--rp-accent); margin-bottom:16px; }
  .rt-ledger .rp-label{ padding-bottom:6px; border-bottom:1px solid var(--rp-line); }
  .rt-ledger .rp-dates{ font-family:'IBM Plex Mono',monospace; }
  .rt-ledger .rp-tag{ background:var(--rp-line); }

  /* Studio - tinted sidebar, two columns, name set in the accent. */
  .rt-studio{ display:grid; grid-template-columns:35% 1fr; }
  .rt-studio .rp-body{ padding:0; grid-column:1 / -1; display:contents; }
  .rt-studio .rp-sidebar{ background:color-mix(in srgb, var(--rp-accent) 8%, white); padding:18mm 14px 18mm 16mm; }
  .rt-studio .rp-main{ padding:18mm 16mm 18mm 20px; }
  .rt-studio .rp-name{ font-family:'Fraunces',serif; font-weight:700; font-size:22px; color:var(--rp-accent); line-height:1.15; }
  .rt-studio .rp-title{ font-size:12.5px; margin-top:3px; }
  .rt-studio .rp-sidebar .rp-contact{ flex-direction:column; gap:8px; margin-top:16px; }
  .rt-studio .rp-label{ color:var(--rp-accent); }
  .rt-studio .rp-tag{ background:color-mix(in srgb, var(--rp-accent) 18%, white); }

  /* Field - monospace throughout, monochrome, whitespace as structure. */
  .rt-field{ font-family:'IBM Plex Mono',monospace; }
  .rt-field .rp-name{ font-size:19px; font-weight:600; letter-spacing:-.01em; }
  .rt-field .rp-title{ font-size:12.5px; color:var(--rp-soft); margin-top:3px; }
  .rt-field .rp-header{ margin-bottom:22px; }
  .rt-field .rp-label{ font-size:11.5px; color:var(--rp-soft); }
  .rt-field .rp-tag{ background:none; border:1px solid var(--rp-line); }
  .rt-field .rp-section + .rp-section{ margin-top:24px; }

  @media (max-width: 860px){
    .rt-studio{ grid-template-columns:1fr; }
    .rt-studio .rp-sidebar{ padding:16px; }
    .rt-studio .rp-main{ padding:16px; }
  }
</style>
</head>

      Boardly

        <span class="knob"><i class="fa-solid fa-sun icon-sun"></i><i class="fa-solid fa-moon icon-moon"></i></span>

<main class="max-w-7xl mx-auto px-4 sm:px-6 py-6">

  <div class="flex items-center justify-between gap-3 mb-4 flex-wrap">
    <div>
      <h1 class="font-display font-bold text-2xl">CV Builder</h1>
      <p class="text-sm text-ink-soft mt-0.5">Write it once, pick a look, download it wherever you're sending it.</p>
    </div>
    <div class="flex items-center gap-2">
      <select id="cvb-my-cvs" class="input text-sm !w-auto"><option value="">My CVs...</option></select>
      <button type="button" id="cvb-new-btn" class="btn btn-secondary text-sm"><i class="fa-solid fa-plus mr-1"></i>New</button>
    </div>
  </div>

  <p id="cvb-not-ready" class="hidden text-xs text-ink-soft ticket p-3 mb-4"><i class="fa-solid fa-circle-info mr-1 text-orange"></i>CV Builder needs a one-time database update: run <code>supabase/schema_v61_cv_builder.sql</code>.</p>

  <div class="ticket p-4 mb-5">
    <div class="flex flex-col lg:flex-row lg:items-center gap-4">
      <input id="cvb-title" type="text" maxlength="100" placeholder="e.g. Product Designer CV" class="input text-sm font-medium lg:max-w-xs">

      <div class="flex items-center gap-2">
        <span class="text-xs text-ink-soft mr-1">Template</span>
        <button type="button" data-template="ledger" class="cvb-template-swatch h-9 w-12 rounded-md border border-line bg-white overflow-hidden relative" title="Ledger">
          <span class="absolute inset-x-1 top-1 h-1 rounded-sm" style="background:rgba(28,28,28,.75)"></span>
          <span class="absolute inset-x-1 top-3 h-0.5 rounded-sm" style="background:rgba(28,28,28,.3)"></span>
          <span class="absolute inset-x-1 top-4 h-0.5 rounded-sm" style="background:rgba(28,28,28,.18)"></span>
        </button>
        <button type="button" data-template="studio" class="cvb-template-swatch h-9 w-12 rounded-md border border-line bg-white overflow-hidden relative" title="Studio">
          <span class="absolute left-1 top-1 bottom-1 w-3 rounded-sm" style="background:rgba(232,98,44,.45)"></span>
          <span class="absolute left-5 right-1 top-1 h-1 rounded-sm" style="background:rgba(28,28,28,.55)"></span>
          <span class="absolute left-5 right-1 top-3 h-0.5 rounded-sm" style="background:rgba(28,28,28,.22)"></span>
        </button>
        <button type="button" data-template="field" class="cvb-template-swatch h-9 w-12 rounded-md border border-line bg-white overflow-hidden relative" title="Field">
          <span class="absolute inset-x-1 top-1.5 h-0.5 rounded-sm" style="background:rgba(28,28,28,.65)"></span>
          <span class="absolute inset-x-1 top-5 h-0.5 rounded-sm" style="background:rgba(28,28,28,.3)"></span>
        </button>
      </div>

      <div class="flex items-center gap-2">
        <span class="text-xs text-ink-soft mr-1">Accent</span>
        <button type="button" data-accent="orange" class="cvb-color-dot h-6 w-6 rounded-full text-orange" style="background:currentColor"></button>
        <button type="button" data-accent="teal" class="cvb-color-dot h-6 w-6 rounded-full text-teal" style="background:currentColor"></button>
        <button type="button" data-accent="violet" class="cvb-color-dot h-6 w-6 rounded-full text-violet" style="background:currentColor"></button>
        <button type="button" data-accent="pink" class="cvb-color-dot h-6 w-6 rounded-full text-pink" style="background:currentColor"></button>
      </div>

      <div class="flex items-center gap-2 lg:ml-auto flex-wrap">
        <button type="button" id="cvb-save-btn" class="btn btn-secondary text-sm">Save</button>
        <button type="button" id="cvb-download-json-btn" class="btn btn-secondary text-sm" title="Download your CV data as JSON - a portable backup"><i class="fa-solid fa-file-code mr-1"></i>JSON</button>
        <button type="button" id="cvb-download-pdf-btn" class="btn btn-primary btn-pop text-sm"><i class="fa-solid fa-file-pdf mr-1"></i>Download PDF</button>
      </div>
    </div>
    <p id="cvb-status" class="text-xs text-ink-soft mt-2"></p>
  </div>

  <div class="grid lg:grid-cols-2 gap-5 items-start">

    <div class="space-y-3">

      <div class="cvb-acc ticket" data-open="true" data-section="personal">
        <button type="button" class="cvb-acc-toggle w-full flex items-center justify-between p-4 text-left">
          <span class="font-display font-semibold text-sm flex items-center gap-2"><i class="fa-solid fa-id-card text-orange"></i>Personal info</span>
          <i class="fa-solid fa-chevron-down cvb-acc-chevron text-ink-soft text-xs"></i>
        </button>
        <div class="cvb-acc-body"><div class="px-4 pb-4 grid sm:grid-cols-2 gap-2">
          <input id="cvb-p-fullName" type="text" placeholder="Full name" class="input text-sm sm:col-span-2">
          <input id="cvb-p-title" type="text" placeholder="Headline, e.g. Senior Product Designer" class="input text-sm sm:col-span-2">
          <input id="cvb-p-email" type="email" placeholder="Email" class="input text-sm">
          <input id="cvb-p-phone" type="text" placeholder="Phone" class="input text-sm">
          <input id="cvb-p-location" type="text" placeholder="Location" class="input text-sm">
          <input id="cvb-p-website" type="text" placeholder="Website or portfolio link" class="input text-sm">
        </div></div>
      </div>

      <div class="cvb-acc ticket" data-open="true" data-section="summary">
        <button type="button" class="cvb-acc-toggle w-full flex items-center justify-between p-4 text-left">
          <span class="font-display font-semibold text-sm flex items-center gap-2"><i class="fa-solid fa-pen-nib text-teal"></i>Summary</span>
          <i class="fa-solid fa-chevron-down cvb-acc-chevron text-ink-soft text-xs"></i>
        </button>
        <div class="cvb-acc-body"><div class="px-4 pb-4">
          <textarea id="cvb-summary" rows="3" maxlength="600" placeholder="A few sentences on who you are and what you're looking for." class="input text-sm resize-none w-full"></textarea>
        </div></div>
      </div>

      <div class="cvb-acc ticket" data-open="true" data-section="experience">
        <button type="button" class="cvb-acc-toggle w-full flex items-center justify-between p-4 text-left">
          <span class="font-display font-semibold text-sm flex items-center gap-2"><i class="fa-solid fa-briefcase text-violet"></i>Experience</span>
          <i class="fa-solid fa-chevron-down cvb-acc-chevron text-ink-soft text-xs"></i>
        </button>
        <div class="cvb-acc-body"><div class="px-4 pb-4">
          <div id="cvb-list-experience" class="space-y-2"></div>
          <button type="button" data-add="experience" class="btn btn-secondary text-xs w-full mt-2">Add role</button>
        </div></div>
      </div>

      <div class="cvb-acc ticket" data-open="false" data-section="education">
        <button type="button" class="cvb-acc-toggle w-full flex items-center justify-between p-4 text-left">
          <span class="font-display font-semibold text-sm flex items-center gap-2"><i class="fa-solid fa-graduation-cap text-pink"></i>Education</span>
          <i class="fa-solid fa-chevron-down cvb-acc-chevron text-ink-soft text-xs"></i>
        </button>
        <div class="cvb-acc-body"><div class="px-4 pb-4">
          <div id="cvb-list-education" class="space-y-2"></div>
          <button type="button" data-add="education" class="btn btn-secondary text-xs w-full mt-2">Add education</button>
        </div></div>
      </div>

      <div class="cvb-acc ticket" data-open="false" data-section="skills">
        <button type="button" class="cvb-acc-toggle w-full flex items-center justify-between p-4 text-left">
          <span class="font-display font-semibold text-sm flex items-center gap-2"><i class="fa-solid fa-star text-orange"></i>Skills</span>
          <i class="fa-solid fa-chevron-down cvb-acc-chevron text-ink-soft text-xs"></i>
        </button>
        <div class="cvb-acc-body"><div class="px-4 pb-4">
          <input id="cvb-skills-input" type="text" placeholder="Type a skill and press Enter" class="input text-sm w-full mb-2">
          <div id="cvb-list-skills" class="flex flex-wrap gap-1.5"></div>
        </div></div>
      </div>

      <div class="cvb-acc ticket" data-open="false" data-section="projects">
        <button type="button" class="cvb-acc-toggle w-full flex items-center justify-between p-4 text-left">
          <span class="font-display font-semibold text-sm flex items-center gap-2"><i class="fa-solid fa-diagram-project text-teal"></i>Projects</span>
          <i class="fa-solid fa-chevron-down cvb-acc-chevron text-ink-soft text-xs"></i>
        </button>
        <div class="cvb-acc-body"><div class="px-4 pb-4">
          <div id="cvb-list-projects" class="space-y-2"></div>
          <button type="button" data-add="projects" class="btn btn-secondary text-xs w-full mt-2">Add project</button>
        </div></div>
      </div>

      <div class="cvb-acc ticket" data-open="false" data-section="certifications">
        <button type="button" class="cvb-acc-toggle w-full flex items-center justify-between p-4 text-left">
          <span class="font-display font-semibold text-sm flex items-center gap-2"><i class="fa-solid fa-certificate text-violet"></i>Certifications</span>
          <i class="fa-solid fa-chevron-down cvb-acc-chevron text-ink-soft text-xs"></i>
        </button>
        <div class="cvb-acc-body"><div class="px-4 pb-4">
          <div id="cvb-list-certifications" class="space-y-2"></div>
          <button type="button" data-add="certifications" class="btn btn-secondary text-xs w-full mt-2">Add certification</button>
        </div></div>
      </div>

      <div class="cvb-acc ticket" data-open="false" data-section="languages">
        <button type="button" class="cvb-acc-toggle w-full flex items-center justify-between p-4 text-left">
          <span class="font-display font-semibold text-sm flex items-center gap-2"><i class="fa-solid fa-language text-pink"></i>Languages</span>
          <i class="fa-solid fa-chevron-down cvb-acc-chevron text-ink-soft text-xs"></i>
        </button>
        <div class="cvb-acc-body"><div class="px-4 pb-4">
          <div id="cvb-list-languages" class="space-y-2"></div>
          <button type="button" data-add="languages" class="btn btn-secondary text-xs w-full mt-2">Add language</button>
        </div></div>
      </div>

    </div>

    <div class="lg:sticky lg:top-24">
      <div id="cvb-preview-wrap" class="overflow-x-auto pb-4">
        <div id="cvb-preview"></div>
      </div>
    </div>

  </div>

</main>

<div id="toast-wrap" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 items-end"></div>

<script src="js/supabase-client.js"></script>
<script src="js/site.js"></script>
<script src="js/pdf-export.js"></script>
<script src="js/cv-builder.js"></script>
